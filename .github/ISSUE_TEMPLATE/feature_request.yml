name: Idea
description: Something Trawler could do for you.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you hit
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another tool, a workaround, or not at all.
