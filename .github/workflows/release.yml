# A v<version> tag builds every installer and leaves a draft release for the
# owner to publish (DEC-86). Publishing the draft is the release.
name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag equals the workspace version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: 1.99.0

      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "trawler-ui") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG differs from the workspace version v$version"
            exit 1
          fi

  build:
    name: Build · ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-universal
            host: aarch64-apple-darwin
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            package-args: --universal
            bundle: target/universal-apple-darwin/release/bundle
            wrap: ""
          - name: windows-x64
            host: x86_64-pc-windows-msvc
            os: windows-latest
            targets: ""
            package-args: ""
            bundle: target/release/bundle
            wrap: ""
          - name: windows-arm64
            host: aarch64-pc-windows-msvc
            os: windows-11-arm
            targets: ""
            package-args: ""
            bundle: target/release/bundle
            wrap: ""
          - name: linux-x64
            host: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            targets: ""
            package-args: ""
            bundle: target/release/bundle
            wrap: xvfb-run
          - name: linux-arm64
            host: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            targets: ""
            package-args: ""
            bundle: target/release/bundle
            wrap: xvfb-run
    steps:
      - env:
          KEY_PRESENT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$KEY_PRESENT" != true ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is empty or missing"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - if: startsWith(matrix.os, 'ubuntu')
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libssl-dev libxdo-dev patchelf xvfb

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.targets }}

      - env:
          HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          rustc -vV | grep -qx "host: $HOST"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - run: cargo xtask package ${{ matrix.package-args }} --build-only

      - run: cargo xtask package ${{ matrix.package-args }} --bundle-only
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - run: ${{ matrix.wrap }} cargo xtask smoke ${{ matrix.package-args }}

      - run: cargo xtask package ${{ matrix.package-args }} --sign-only
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/*/*.dmg
            ${{ matrix.bundle }}/*/*.app.tar.gz
            ${{ matrix.bundle }}/*/*.msi
            ${{ matrix.bundle }}/*/*-setup.exe
            ${{ matrix.bundle }}/*/*.deb
            ${{ matrix.bundle }}/*/*.rpm
            ${{ matrix.bundle }}/*/*.AppImage
            ${{ matrix.bundle }}/*/*.sig

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: 1.99.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist

      - run: |
          find dist -mindepth 2 -type f -exec mv -n {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          if [ -n "$(find dist -mindepth 1 -type d)" ]; then
            find dist -mindepth 2 -type f
            echo "::error::two artifacts share a file name"
            exit 1
          fi

      - env:
          TAG: ${{ github.ref_name }}
        run: >-
          cargo xtask release-manifest dist --tag "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/notes.md notes.md
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" dist/* --draft --title "Trawler ${TAG#v}" --notes-file notes.md
