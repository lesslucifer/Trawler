[package]
name = "trawler"
version = "0.1.0"
edition = "2021"
description = "A native HTTP(S) debugging proxy that intercepts and inspects network traffic, à la Charles / Proxyman"
license = "MIT"
repository = "https://github.com/lesslucifer/Trawler"

[lib]
name = "trawler"
path = "src/lib.rs"

[[bin]]
name = "trawler"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hudsucker = { version = "0.24", features = ["rcgen-ca", "rustls-client"] }
rcgen = { version = "0.14", features = ["pem", "crypto"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
http = "1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
flate2 = "1"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = true
codegen-units = 1
