[workspace]
members = ["xtask", "ui/src-tauri", "login-service"]
default-members = [".", "ui/src-tauri"]

[workspace.package]
version = "0.1.0-1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[package]
name = "trawler"
version.workspace = true
edition = "2021"
description = "A native HTTP(S) debugging proxy that intercepts and inspects network traffic, à la Charles / Proxyman"
license = "MIT"
repository = "https://github.com/lesslucifer/Trawler"

[lib]
name = "trawler"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "trawler"
path = "src/main.rs"

[features]
test-utils = []
hook-tests = []

[[test]]
name = "dod_hooks"
required-features = ["hook-tests"]

[[test]]
name = "worktree_setup_hook"
required-features = ["hook-tests"]

[[test]]
name = "e2e_manual_review"
required-features = ["hook-tests"]

[[test]]
name = "e2e_gate_truth"
required-features = ["hook-tests"]

[[test]]
name = "gate_nits"
required-features = ["hook-tests"]

[[test]]
name = "e2e_simpwf"
required-features = ["hook-tests"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hudsucker = { version = "0.24", features = ["rcgen-ca", "rustls-client", "http2"] }
rcgen = { version = "0.14", features = ["pem", "crypto"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-body-util = "0.1"
http = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "v5"] }
base64 = "0.22"
form_urlencoded = "1.2"
flate2 = "1"
brotli = "8"
encoding_rs = "0.8"
quick-xml = "0.37"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "aws-lc-rs"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
if-addrs = "0.15.0"

[dev-dependencies]
trawler = { path = ".", features = ["test-utils"] }
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
insta = { version = "1", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.package-test]
inherits = "release"
lto = false
codegen-units = 16
