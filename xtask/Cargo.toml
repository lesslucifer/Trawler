[package]
name = "xtask"
version.workspace = true
edition = "2021"
description = "Repo tooling: the verify-dod done-gate over git-note evidence"
license = "MIT"
authors = ["Vu Luu"]
homepage = "https://github.com/lesslucifer/Trawler"
publish = false

[lib]
doctest = false

[features]
hook-tests = []
debug-tests = []
design-e2e = []
codex-e2e = []
package-tests = []

[[test]]
name = "dod_gate"
required-features = ["hook-tests"]

[[test]]
name = "e2e_design_flow"
required-features = ["design-e2e"]

[[test]]
name = "e2e_codex_harness"
required-features = ["codex-e2e"]

[[test]]
name = "package_bundle"
required-features = ["package-tests"]

[[test]]
name = "debug_serve"
required-features = ["debug-tests"]

[dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"

[lints]
workspace = true
