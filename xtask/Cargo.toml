[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Repo tooling: the verify-dod done-gate over git-note evidence"
publish = false

[features]
hook-tests = []
debug-tests = []
design-e2e = []
codex-e2e = []

[[test]]
name = "dod_gate"
required-features = ["hook-tests"]

[[test]]
name = "e2e_design_flow"
required-features = ["design-e2e"]

[[test]]
name = "e2e_codex_harness"
required-features = ["codex-e2e"]

[[test]]
name = "debug_serve"
required-features = ["debug-tests"]

[dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
