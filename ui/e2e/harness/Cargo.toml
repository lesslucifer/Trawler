[package]
name = "trawler-e2e-harness"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone crate (outside the core workspace, like ui/src-tauri) so the e2e
# core-launcher never lands in the core's `cargo metadata`. Depends on the core
# lib to boot a real `serve(Config)` on ephemeral ports for the WebDriver e2e.
[workspace]

[dependencies]
trawler = { path = "../../.." }
brotli = "8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = { version = "0.14", features = ["pem", "crypto"] }
tempfile = "3"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[[bin]]
name = "trawler-e2e-harness"
path = "main.rs"
