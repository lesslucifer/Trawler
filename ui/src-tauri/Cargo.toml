[package]
name = "trawler-ui"
version.workspace = true
description = "Trawler — native UI shell (thin Tauri window over the control API)"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/lesslucifer/Trawler"
default-run = "trawler-ui"

[lib]
name = "trawler_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
# The window loads the bundle embedded from ui/dist. `cargo xtask ui dev` turns
# it off so the window loads the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# WebDriver e2e build only — pulls the wdio plugins so the embedded WebDriver
# and execute API exist. Release builds omit this, keeping the shell thin.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
# The walkthrough build only (E-ONBREV.W1): every command that reads or changes
# this machine answers from a script the harness sets. Never in a release build.
scenario = ["e2e"]

[dependencies]
trawler = { path = "../.." }
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1_smol = "1"
md-5 = "0.10"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14"

[target.'cfg(target_os = "macos")'.dependencies]
trawler-login-service = { path = "../../login-service" }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2.1", features = ["test"] }
minisign = "0.10.0"
flate2 = "1.1.10"
tar = "0.4.46"
serde_json = "1"

[lints]
workspace = true
