[package]
name = "trawler-ui"
version = "0.1.0"
description = "Trawler — native UI shell (thin Tauri window over the control API)"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/lesslucifer/Trawler"

[lib]
name = "trawler_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
# WebDriver e2e build only — pulls the wdio plugins so the embedded WebDriver
# and execute API exist. Release builds omit this, keeping the shell thin.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
# The walkthrough build only (E-ONBREV.W1): every command that reads or changes
# this machine answers from a script the harness sets. Never in a release build.
scenario = ["e2e"]

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha1_smol = "1"
md-5 = "0.10"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
tauri = { version = "2.1", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
