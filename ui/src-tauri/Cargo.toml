[package]
name = "trawler-ui"
version = "0.1.0"
description = "Trawler — native UI shell (thin Tauri window over the control API)"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/lesslucifer/Trawler"

[lib]
name = "trawler_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
